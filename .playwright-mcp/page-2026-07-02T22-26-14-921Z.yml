        - generic [ref=e194]:
          - heading "Tier eligibility" [level=2] [ref=e196]
          - paragraph [ref=e198]: You and everyone using the Unity Software on your behalf must be Tier Eligible at all times. “Tier Eligible” means that your Total Finances cannot exceed the defined Financial Thresholds for the tier of Unity Software you (or those providing services to you) are using. Tier Eligibility is measured for the most recent twelve (12) month period. If you are mid-project, and your Total Finances grow to exceed the Financial Threshold of the Unity Software tier you are using, you do not need to start from scratch – you can simply upgrade your license and continue working. How we measure your Total Finances varies based on who you are. Financial Thresholds are shown in US currency and your Total Finances will be converted to US currency to determine your Tier Eligibility.
          - heading "How total finances are measured" [level=2] [ref=e200]
          - generic [ref=e201]:
            - paragraph [ref=e202]: If you are a Legal Entity using the Unity Software (other than to provide services to someone else), your Total Finances are your gross revenues and/or funding (no matter what the source),
            - paragraph [ref=e203]: If you are an individual or a Legal Entity providing services to a third party, your Total Finances are deemed to be your customer or client’s Total Finances, and if you are an individual using the Unity Software, but not providing services to a third party, your Total Finances are the amount generated in connection with your use of the Unity Software. In this case, your Total Finances would not include amounts you generate from other work (for example, if your day job is as a zookeeper).
            - paragraph [ref=e204]: By using the Unity Software, you represent and warrant that you are Tier Eligible to use the tier of Unity Software you are using and those being used on your behalf. You understand that it is your responsibility to maintain complete records establishing your Tier Eligibility and you bear the burden of proving your Tier Eligibility if we ask.
          - heading "Financial thresholds" [level=2] [ref=e206]
          - generic [ref=e207]:
            - paragraph [ref=e208]: The Financial Threshold for Unity Personal is US $200,000 for the most recent twelve (12) month period. To be Tier Eligible to use Unity Personal, your Total Finances may not exceed US $200,000. If your Total Finances exceed US $200,000 you may not use Unity Personal at all, even for internal projects or prototyping.
            - paragraph [ref=e209]: The Financial Threshold for Unity Pro is from $200,001 to $24,999,999 USD for the most recent twelve (12) month period. To be Tier Eligible to use Unity Pro, your Total Finances may not exceed $24,999,999 USD. If your Total Finances equal or exceed $25,000,000 USD, you may only use Unity Enterprise.
            - paragraph [ref=e210]: The Financial Threshold for Unity Enterprise is $25,000,000 USD and over for the most recent twelve (12) month period. If your Total Finances equal or exceed $25,000,000 USD, you may only use Unity Enterprise.
            - paragraph [ref=e211]: Notwithstanding the foregoing, the Financial Threshold for Industry Customers is $1,000,000 USD for the most recent twelve (12) month period. If your Total Finances exceed $1,000,000 USD, you may only use Unity Industry.
            - paragraph [ref=e212]: For clarity, unless otherwise set forth above, these Financial Thresholds apply whether or not you use the Unity Software as part of a Unity Plan.
            - paragraph [ref=e213]: By using the Unity Software, you represent and warrant that you are Tier Eligible to use the tier of Unity Software you are using and those being used on your behalf. You understand that it is your responsibility to maintain complete records establishing your Tier Eligibility and you bear the burden of proving your Tier Eligibility if we ask.
          - heading "No mixing or co-mingling" [level=2] [ref=e215]
          - generic [ref=e216]:
            - paragraph [ref=e217]: Unity Software tiers with different Financial Thresholds may not be used at the same time by one entity or individual or for or on behalf of one entity or individual. You must upgrade all subscriptions if your Total Finances exceed a Financial Threshold. Unity reserves the right to disable your use of the Unity Software if you attempt to use two tiers simultaneously. If you are using Unity Pro and want to provide services to a customer or client who is Tier Eligible to use Unity Enterprise or Industry, contact us.
            - paragraph [ref=e218]: Unity may monitor your compliance with and enforce these restrictions and requirements, including but not limited to monitoring the number of downloads of your Project Content, and any available revenue estimate data.
            - paragraph [ref=e219]: Unity Personal users may be required to complete a user survey in order to activate the Unity Software.
